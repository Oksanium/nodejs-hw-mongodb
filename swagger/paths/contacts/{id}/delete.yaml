tags:
  - Contacts
summary: Delete contact
operationId: deleteContact
description: 'Delete a contact by its ID'
security:
  - bearerAuth: []
parameters:
  - in: query
    name: id
    schema:
      type: string
    example: 65e4decdd286b30065d54af9
responses:
  '204':
    description: Deletes a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
          properties:
            status:
              type: integer
              example: 204
  '401':
    $ref: '../../../components/responses/401.yaml'
